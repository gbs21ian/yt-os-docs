<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>YT OS · Project Docs</title>
  <meta name="description" content="YT OS 프로젝트 문서 허브">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand-mark">YT</div>
        <div><strong>YT OS</strong><span>Project Docs</span></div>
        <button class="icon-btn mobile-only" id="closeSidebar" aria-label="메뉴 닫기">×</button>
      </div>

      <button class="search-button" id="openSearch"><span>⌕</span><span>문서 검색</span><kbd>/</kbd></button>

      <div class="filter-group">
        <label>카테고리</label>
        <div id="categoryFilters" class="filter-stack"></div>
      </div>
      <div class="filter-group">
        <label>상태</label>
        <div id="statusFilters" class="filter-stack"></div>
      </div>

      <div class="sidebar-footer">
        <div class="build-pill"><span class="pulse"></span><span id="buildTime">문서 인덱스 불러오는 중</span></div>
        <button class="text-btn" id="themeToggle">테마 전환</button>
      </div>
    </aside>

    <main class="main-column">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="openSidebar" aria-label="메뉴 열기">☰</button>
        <div class="breadcrumb"><span>YT OS</span><span>/</span><strong id="breadcrumbTitle">문서 허브</strong></div>
        <div class="top-actions"><span id="docCount" class="quiet"></span><button class="ghost-btn" id="showOverview">전체 현황</button></div>
      </header>

      <div class="content-grid">
        <section class="content-panel">
          <div id="overview" class="overview"></div>
          <article id="docView" class="doc-view hidden"></article>
        </section>
        <aside class="right-rail" id="rightRail"></aside>
      </div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="searchModal" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
    <div class="search-modal">
      <div class="search-input-wrap"><span>⌕</span><input id="searchInput" placeholder="제목, 태그, 본문 검색…" autocomplete="off"><kbd>ESC</kbd></div>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
